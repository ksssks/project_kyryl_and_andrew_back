name: Lab 4 Helm Chart Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  helm-check:
    name: Helm Chart Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Make test script executable
        run: chmod +x ./tests/lab4_test.sh

      - name: Run Lab 4 Grading Script
        run: ./tests/lab4_test.sh