name: Lab 4 Helm Chart Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  helm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Set up Kind
        uses: engineerd/setup-kind@v0.9.0
        with:
          version: v0.20.0

      - name: Create Kubernetes cluster
        run: kind create cluster --name lab4

      - name: Make test script executable
        run: chmod +x ./tests/lab4_test.sh

      - name: Run Lab 4 Grading Script
        run: ./tests/lab4_test.sh