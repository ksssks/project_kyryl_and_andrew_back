name: Lab 3 - Kubernetes CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lab3:
    runs-on: ubuntu-latest
    env:
      KUBECONFIG: $HOME/.kube/config
    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Install KinD and kubectl
      - name: Install KinD and kubectl
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # 3. Create KinD cluster
      - name: Create KinD Cluster
        run: |
          kind create cluster --name lab3 --wait 120s
          # Ensure kubeconfig points to the new cluster
          kind get kubeconfig --name lab3 > $HOME/.kube/config

      # 4. Apply Kubernetes manifests
      - name: Apply k8s manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment-mongo.yaml
          kubectl apply -f k8s/service-mongo.yaml
          kubectl apply -f k8s/deployment-app.yaml
          kubectl apply -f k8s/service-app.yaml

      # 5. Wait for pods to be ready
      - name: Wait for pods
        run: |
          # Wait for all pods in the namespace to be ready
          kubectl wait --for=condition=Ready pods --all --namespace=ecommerce --timeout=180s

      # 6. Run Lab 3 Master Validation Script
      - name: Run Master Validation Script
        run: |
          chmod +x ./tests/lab3_test.sh
          ./tests/lab3_test.sh