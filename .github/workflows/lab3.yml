name: Lab 3 - Kubernetes CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install KinD
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create cluster
        run: kind create cluster

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Create secrets
        run: |
          kubectl create secret generic mongo-secret \
            --from-literal=DB_USER=mongo-user \
            --from-literal=DB_PASSWORD=mongo-password \
            --from-literal=STRIPE_SECRET_KEY=stripe_key

      - name: Create configmap
        run: kubectl create configmap mongo-config --from-literal=mongo-url=mongo-service

      - name: Apply manifests
        run: kubectl apply -f k8s/

      - name: Wait for ecommerce-app deployment
        run: kubectl rollout status deployment/ecommerce-app --timeout=90s

      - name: Run tests
        run: bash tests/lab3_test.sh