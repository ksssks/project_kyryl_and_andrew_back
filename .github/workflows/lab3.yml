name: Lab 3 - Kubernetes CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lab3:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Install KinD and kubectl
      - name: Install KinD and kubectl
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # 3. Create KinD cluster and generate kubeconfig
      - name: Create KinD Cluster
        run: |
          kind create cluster --name lab3 --wait 60s
          mkdir -p $HOME/.kube
          kind get kubeconfig --name lab3 > $HOME/.kube/config
          export KUBECONFIG=$HOME/.kube/config
          kubectl cluster-info

      # 4. Apply Kubernetes manifests
      - name: Apply k8s manifests
        run: |
          export KUBECONFIG=$HOME/.kube/config
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment-mongo.yaml
          kubectl apply -f k8s/service-mongo.yaml
          kubectl apply -f k8s/deployment-app.yaml
          kubectl apply -f k8s/service-app.yaml

      # 5. Wait for all pods to be ready
      - name: Wait for pods
        run: |
          export KUBECONFIG=$HOME/.kube/config
          kubectl wait --for=condition=Ready pods --all --namespace=ecommerce --timeout=180s

      # 6. Run Lab 3 Master Validation Script
      - name: Run Master Validation Script
        env:
          KUBECONFIG: $HOME/.kube/config
        run: |
          chmod +x ./tests/lab3_test.sh
          ./tests/lab3_test.sh