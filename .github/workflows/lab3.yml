name: Lab 3 - Kubernetes CI

on:
  push:
    branches:
      - "**"   # Тепер спрацьовує на будь-яку гілку
  pull_request:

jobs:
  lab3:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      # Create KinD cluster
      - name: Create KinD cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ecommerce-cluster
 
      # Verify cluster
      - name: Check cluster
        run: kubectl cluster-info

      # Load Docker images into KinD
      - name: Build and load app image into KinD
        run: |
          docker build -t ecommerce-app:latest .
          kind load docker-image ecommerce-app:latest --name ecommerce-cluster

      # Apply ConfigMap and Secret
      - name: Apply ConfigMap and Secret
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml

      # Deploy MongoDB
      - name: Deploy MongoDB
        run: |
          kubectl apply -f k8s/deployment-mongo.yaml
          kubectl apply -f k8s/service-mongo.yaml
          kubectl wait --for=condition=ready pod -l app=mongo --timeout=120s

      # Deploy App
      - name: Deploy App
        run: |
          kubectl apply -f k8s/deployment-app.yaml
          kubectl apply -f k8s/service-app.yaml
          kubectl wait --for=condition=ready pod -l app=ecommerce --timeout=120s

      # Debug pods
      - name: Debug pods
        run: |
          echo "### Pods ###"
          kubectl get pods
          echo "### Pod Description ###"
          kubectl describe pods
          echo "### Pod Logs ###"
          kubectl logs -l app=ecommerce --tail=50 || true

      # 10. Run Lab 3 Master Validation Script
      - name: Run Master Validation Script
        run: |
          chmod +x ./tests/lab3_test.sh
          ./tests/lab3_test.sh